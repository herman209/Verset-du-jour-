<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verset</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;font-family:Georgia,serif;background:white;color:#222}
#verset{max-width:700px;padding:35px;font-size:28px;line-height:1.5}
</style>
</head>
<body>
<div id="verset"></div>
<script>
const versets=[
"L'Éternel est mon berger : je ne manquerai de rien. — Psaume 23:1",
"Je puis tout par celui qui me fortifie. — Philippiens 4:13",
"Car Dieu a tant aimé le monde qu'il a donné son Fils unique. — Jean 3:16",
"Confie-toi en l'Éternel de tout ton cœur. — Proverbes 3:5",
"L'Éternel est ma lumière et mon salut : de qui aurais-je crainte ? — Psaume 27:1",
"Soyez toujours joyeux. Priez sans cesse. — 1 Thessaloniciens 5:16-17",
"Déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous. — 1 Pierre 5:7",
"Demandez, et l'on vous donnera ; cherchez, et vous trouverez. — Matthieu 7:7",
"Tout est possible à celui qui croit. — Marc 9:23",
"Que tout ce que vous faites se fasse avec amour. — 1 Corinthiens 16:14"
];
let precedent=Number(localStorage.getItem("dernierVerset"));
let choix;
do{choix=Math.floor(Math.random()*versets.length)}while(choix===precedent && versets.length>1);
localStorage.setItem("dernierVerset",choix);
document.getElementById("verset").textContent=versets[choix];
</script>
</body>
</html>
